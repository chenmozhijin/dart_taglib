name: taglib-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          path: dart_taglib
          submodules: recursive

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Verify TagLib vendor
        working-directory: dart_taglib
        run: ./tool/update_taglib.ps1 -Check

      - name: Dart analyze
        working-directory: dart_taglib
        run: |
          dart pub get
          dart analyze

      - name: Dart test (VM)
        working-directory: dart_taglib
        run: dart test

  sdk-minimum:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          path: dart_taglib
          submodules: recursive

      - name: Setup minimum Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.0

      - name: Minimum SDK validation
        working-directory: dart_taglib
        run: |
          dart pub get
          dart analyze
          dart test

  android-hook:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          path: dart_taglib
          submodules: recursive

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        shell: bash
        run: |
          ndk_version='27.0.12077973'
          sdkmanager "ndk;$ndk_version"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$ndk_version" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_SDK_ROOT/ndk/$ndk_version" >> "$GITHUB_ENV"

      - name: Android hook validation
        working-directory: dart_taglib
        run: |
          dart pub get
          dart test -r expanded test/build_hook_integration_test.dart --plain-name "android build hook emits a bundled .so without libc++_shared dependency"

  ios-hook:
    runs-on: macos-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          path: dart_taglib
          submodules: recursive

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: iOS hook validation
        working-directory: dart_taglib
        run: |
          dart pub get
          dart test -r expanded test/build_hook_integration_test.dart --plain-name "ios build hook emits a bundled dylib for iphoneos arm64"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          path: dart_taglib
          submodules: recursive

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14

      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Build wasm bridge
        working-directory: dart_taglib
        run: ./tool/build_wasm.ps1

      - name: Prepare browser runtime assets
        working-directory: dart_taglib
        run: ./tool/prepare_browser_test_assets.ps1

      - name: Chrome integration test
        working-directory: dart_taglib
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          dart pub get
          dart test -p chrome test/browser_wasm_integration_test.dart test/browser_fixture_matrix_test.dart test/browser_wasm_loader_failure_test.dart

      - name: Compile pure Dart Web example
        working-directory: dart_taglib
        run: dart compile js --no-source-maps example/web/main.dart -o .dart_tool/example_web.js

  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          path: dart_taglib
          submodules: recursive

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Verify license headers
        working-directory: dart_taglib
        run: python tool/check_license_headers.py

      - name: Run package example
        working-directory: dart_taglib
        run: |
          dart pub get
          dart run example/dart_taglib_example.dart test/fixtures/sample.mp3

      - name: Generate API documentation
        working-directory: dart_taglib
        run: dart doc --output .dart_tool/doc

      - name: Verify pub.dev score
        working-directory: dart_taglib
        run: |
          dart pub global activate pana 0.23.14
          dart pub global run pana . --exit-code-threshold=160

      - name: Verify Pub archive
        working-directory: dart_taglib
        run: ./tool/verify_pub_archive.ps1

  flutter-web-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          path: dart_taglib
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: Resolve package dependencies
        working-directory: dart_taglib
        run: dart pub get

      - name: Build Flutter Web asset fixture
        working-directory: dart_taglib/test/flutter_web_asset_app
        run: |
          flutter pub get
          flutter analyze
          flutter build web --release

      - name: Verify bundled Web runtime hashes
        working-directory: dart_taglib
        run: dart run dart_taglib:install_web_runtime --check --output test/flutter_web_asset_app/build/web/assets/packages/dart_taglib/web_runtime
